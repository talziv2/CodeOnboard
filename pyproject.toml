[project]
name = "codeonboard"
version = "0.1.0"
description = "AI-powered codebase onboarding"
requires-python = ">=3.14"
dependencies = [
    # LLM + API
    "anthropic>=0.97.0",
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    # Data validation
    "pydantic>=2.13.3",
    # Config
    "python-dotenv>=1.2.2",
    # Repo cloning
    "gitpython>=3.1.0",
    # AST parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Embeddings
    "voyageai>=0.3.0",
    # Vector store — added in Part 3 (requires Python <=3.13)
    # "chromadb>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
