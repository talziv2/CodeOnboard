[project]
name = "codeonboard"
version = "0.1.0"
description = "AI-powered codebase onboarding"
requires-python = ">=3.14"
dependencies = [
    # LLM + API
    "anthropic>=0.97.0",
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    # Data validation
    "pydantic>=2.13.3",
    # Config
    "python-dotenv>=1.2.2",
    # Repo cloning
    "gitpython>=3.1.0",
    # AST parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Embeddings (nomic-embed-text-v1.5 via sentence-transformers, runs locally)
    "sentence-transformers>=5.4.1",
    # Required transitively by nomic-embed-text-v1.5's modeling code
    "einops>=0.8.0",
    # Vector store
    "chromadb>=1.5.9",
    # Pipeline orchestration (graph-based, replaces plain runner.py chain)
    "langgraph>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
