[project]
name = "codeonboard"
version = "0.1.0"
description = "AI-powered codebase onboarding"
requires-python = ">=3.11"
dependencies = [
    # LLM + API
    "anthropic>=0.97.0",
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    # Data validation
    "pydantic>=2.13.3",
    # Config
    "python-dotenv>=1.2.2",
    # Repo cloning
    "gitpython>=3.1.0",
    # AST parsing — Layer A's deterministic index (backend/repo/parser.py)
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Pipeline orchestration
    "langgraph>=0.2.0",
    # Password hashing — Argon2id. The one part of authentication that must
    # never be hand-rolled, and the only dependency M2 adds.
    "argon2-cffi>=23.1.0",
]

# Stage 5 removed the embedding/vector stack with the retrieval layer it served:
# sentence-transformers, einops and chromadb are gone, and with them torch and
# onnxruntime as transitive weight. Repository understanding is now parsing plus
# tool-driven exploration, neither of which needs a model on the machine.

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
# The Intel-Mac override pins (onnxruntime / numpy / sentence-transformers)
# existed only to make the embedding stack resolve wheels there. Stage 5 removed
# that stack, so the overrides went with it; the lockfile is still resolved for
# Intel Mac so the project stays installable on one.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
