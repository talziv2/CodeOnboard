[project]
name = "codeonboard"
version = "0.1.0"
description = "AI-powered codebase onboarding"
requires-python = ">=3.11"
dependencies = [
    # LLM + API
    "anthropic>=0.97.0",
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    # Data validation
    "pydantic>=2.13.3",
    # Config
    "python-dotenv>=1.2.2",
    # Repo cloning
    "gitpython>=3.1.0",
    # AST parsing — Layer A's deterministic index (backend/repo/parser.py)
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Pipeline orchestration
    "langgraph>=0.2.0",
    # Password hashing — Argon2id. The one part of authentication that must
    # never be hand-rolled, and the only dependency M2 adds.
    "argon2-cffi>=23.1.0",
    # Google OIDC. The other half of authentication that must never be
    # hand-rolled: Authlib validates the ID token's signature, issuer,
    # audience, expiry and nonce against Google's published keys.
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    # The handoff bridge (`backend/mcp_server.py`) — the official Model Context
    # Protocol SDK, so the wire format is not hand-rolled. Measured before it was
    # added: 16 packages in, 0 out, and exactly one existing pin moved (`idna`
    # 3.17 -> 3.19). fastapi, starlette, pydantic, anthropic and langgraph are
    # untouched, which is why this is a dependency and not 110 lines of JSON-RPC.
    "mcp>=2.1.1",
]

# Stage 5 removed the embedding/vector stack with the retrieval layer it served:
# sentence-transformers, einops and chromadb are gone, and with them torch and
# onnxruntime as transitive weight. Repository understanding is now parsing plus
# tool-driven exploration, neither of which needs a model on the machine.

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
# The Intel-Mac override pins (onnxruntime / numpy / sentence-transformers)
# existed only to make the embedding stack resolve wheels there. Stage 5 removed
# that stack, so the overrides went with it; the lockfile is still resolved for
# Intel Mac so the project stays installable on one.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "real_auth: exercises authentication itself — opts out of the signed-in-by-default fixture",
]
