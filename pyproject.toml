[project]
name = "codeonboard"
version = "0.1.0"
description = "AI-powered codebase onboarding"
requires-python = ">=3.11"
dependencies = [
    # LLM + API
    "anthropic>=0.97.0",
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    # Data validation
    "pydantic>=2.13.3",
    # Config
    "python-dotenv>=1.2.2",
    # Repo cloning
    "gitpython>=3.1.0",
    # AST parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Embeddings (nomic-embed-text-v1.5 via sentence-transformers, runs locally)
    "sentence-transformers>=3.0.0",
    # Required transitively by nomic-embed-text-v1.5's modeling code
    "einops>=0.8.0",
    # Vector store
    "chromadb>=1.5.9",
    # Pipeline orchestration (graph-based, replaces plain runner.py chain)
    "langgraph>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
# onnxruntime 1.19+ dropped Intel Mac (x86_64) wheels; pin to last compatible version
# torch 2.2.x (max for Intel Mac) was built against NumPy 1.x; pin numpy<2 and sentence-transformers<4 on Intel Mac only
override-dependencies = [
    "onnxruntime>=1.16.0,<1.19.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=3.0.0,<4.0.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Ensure lockfile resolves wheels compatible with Intel Mac
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
